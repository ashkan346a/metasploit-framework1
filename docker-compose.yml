services:
  ms:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres@db:5432/msf?pool=200&timeout=5
    depends_on:
      - db
    ports:
      - "22:22"
      - "443:443"
      - "4444:4444"
      - "8080:8080"
    volumes:
      - $HOME/.msf4:/home/msfuser/.msf4
    privileged: true

  db:
    image: postgres:10-alpine
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  pg_data:
    driver: local
